# Inventario de hosts para Ansible

[controller]
minio-1 ansible_host=192.168.56.10

[minio]
minio-1 ansible_host=192.168.56.10
minio-2 ansible_host=192.168.56.11

[monitoring]
app-monitor-1 ansible_host=192.168.56.12
app-monitor-2 ansible_host=192.168.56.13

[all:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3